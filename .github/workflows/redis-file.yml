name: Docker Image CI-CD dev
on:
  push:
    branches: [ "mac" ]
env:
  IMAGE_NAME: thomasjiitak/node:latest
jobs:
  build-push-docker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          push: true
          tags: ${{env.IMAGE_NAME}}
          cache-from: type=registry,ref=${{env.IMAGE_NAME}}
          cache-to: type=inline
          build-args: |
            SECRET_NAME=${{secrets.SECRET_NAME}}
            AWS_REGION=${{secrets.AWS_REGION}} 

      - name: Setup SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Check SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no devops@192.168.31.171 "echo 'SSH connection successful'"
      
  deploy-to-ec2:
    needs: build-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run playbook
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: mac.yml
          directory: ./node
          key: ${{secrets.SSH_PRIVATE_KEY}}
          options: |
            --ssh-extra-args "-o StrictHostKeyChecking=no"
            --extra-vars "docker_username=${{ secrets.DOCKER_USERNAME }} docker_password=${{ secrets.DOCKER_PASSWORD }}"
          inventory: |
            192.168.31.171 ansible_user=devops